<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Your One-Time Password</title>
  <style>
    body { font-family: sans-serif; line-height: 1.5; color: #333; }
    .container { max-w-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .otp { font-size: 32px; font-weight: bold; color: #0052ff; letter-spacing: 4px; margin: 20px 0; text-align: center; }
    .footer { font-size: 12px; color: #777; margin-top: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Reset Your Password</h2>
    <p>We received a request to reset your password. Use the following OTP to complete the process:</p>
    <div class="otp">{{OTP}}</div>
    <p>This code will expire shortly. If you did not request a password reset, please ignore this email.</p>
    <div class="footer">
      &copy; WebCampus. All rights reserved.
    </div>
  </div>
</body>
</html>
