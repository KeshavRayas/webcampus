name: webcampus

# Secrets are injected from packages/db/.env via ${VAR}. Set strong values on
# the college server; the local .env values are used by the existing volumes.

services:
  # ----------------------------------------
  # PostgreSQL Database
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-webcampus}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # command: >
    #   postgres
    #   -c wal_level=replica
    #   -c archive_mode=on
    #   -c archive_command="cp %p /var/lib/postgresql/archive/%f"
    #   -c archive_timeout=300
    volumes:
      # - pgdata:/var/lib/postgresql/data
      - ./data/postgres:/var/lib/postgresql/data
      # - ./data/archive:/var/lib/postgresql/archive

  # ----------------------------------------
  # MinIO Object Storage
  # ----------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: webcampus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      # - minio_data:/data
      - ./data/minio:/data

  # ----------------------------------------
  # PgBouncer
  # ----------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: webcampus-pgbouncer
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: pgbouncer_admin
    volumes:
      # Mount your custom configs as Read-Only
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------
  # Redis (In-Memory Cache)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: webcampus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Command arguments to set the RAM limit and eviction policy.
    # AOF persistence is enabled so Redis-only sessions survive restarts.
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru --appendonly yes
    # Uncomment the below lines if you want snapshot persistence as well:
    # --save 60 1
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./data/redis:/data

  # ----------------------------------------
  # Volume Declarations
  # ----------------------------------------
  # volumes:
  #   postgres_data:
  #     driver: local
  #   postgres_archive: # Add the new archive volume
  #     driver: local
  #   minio_data:
  #     driver: local