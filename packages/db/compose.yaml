name: webcampus

services:
  # ----------------------------------------
  # PostgreSQL Database
  # ----------------------------------------
  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: webcampus
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # - pgdata:/var/lib/postgresql/data
      - ./data/postgres:/var/lib/postgresql/data

  # ----------------------------------------
  # MinIO Object Storage
  # ----------------------------------------
  minio:
    image: minio/minio:latest
    container_name: webcampus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: webcampus
      MINIO_ROOT_PASSWORD: example1
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      # - minio_data:/data
      - ./data/minio:/data

# Comment out the volumes if you want to use known directory for local storage (data)
# volumes:
#   pgdata:
#   minio_data:


