[databases]
# Format: incoming_db_name = host=internal_docker_service port=5432 dbname=target_db
webcampus = host=db port=5432 dbname=webcampus

[pgbouncer]
listen_port = 6432
listen_addr = *
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
max_prepared_statements = 100

# THE 3 LOGICAL LAYERS OF POOLING
pool_mode = transaction

# Layer 2: How many incoming connections from Prisma we accept into the queue
max_client_conn = 1000

# Layer 3: The strict limit of actual connections PgBouncer makes to PostgreSQL
default_pool_size = 20

# Enterprise Best Practices
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
admin_users = pgbouncer_admin