global:
  # How often Prometheus polls each target. 15s balances freshness vs load.
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scrapes itself (up time, scrape duration, memory)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The webcampus API container (apps/api). /metrics is only reachable
  # inside the Docker network — it is never published to the host.
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  # Host-run API during LOCAL development only (`bun run dev`). Targets are
  # file-discovered from monitoring/prometheus/targets/*.json, which ships
  # EMPTY: `bun monitoring` writes api-dev.json on dev machines, and it never
  # exists on the server — so prod never scrapes the same API twice.
  - job_name: api-dev
    file_sd_configs:
      - files: ["/etc/prometheus/targets/*.json"]
        refresh_interval: 30s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
